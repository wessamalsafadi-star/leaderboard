<html lang="en">
<head>

<style>
  :root {
    --bh-slate-blue: #1F343F; --bh-denim-blue: #2C537A; --bh-powder-blue: #7BA0B2;
    --bh-sand: #D9B9A0; --bh-mist: #EDE8E4; --bh-white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; cursor: none;
    background: var(--bh-slate-blue) url("assets/bg-hero.jpg") center / cover no-repeat fixed; }
  .scene { position: absolute; inset: 0; opacity: 0; transition: opacity 900ms ease; pointer-events: none; }
  .scene.active { opacity: 1; }
  .chip { border-radius: 2px; background: rgba(0,0,0,0.09); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; }
  /* dark translucent blurred box behind the AED values (podium + rows) */
  .value-chip { border-radius: 4px; background: rgba(0,0,0,0.06);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(4px); border: .5px solid rgba(255,255,255,0.08); padding: 10px 5px !important; }
  .row-panel { position: absolute; left: 1212px; width: 636px; height: 132px; border-radius: 4px;
    background: rgba(255,255,255,0.02); backdrop-filter: blur(11px); }
  /* ---- portrait rendering -------------------------------------------------
     Transparent webms fill their slot freely (like the mockups).
     Photos / initials render as a designed portrait card anchored to the
     bottom of the slot — never a full-slot slab.
     Portraits sit on layer 2: above the scene titles (layer 1), below the
     halo blend layers (4) and the values/names (6). */
  .media-slot { position: absolute; display: flex; align-items: flex-end; justify-content: center; }
  .media-slot video.alpha { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; }
  .media-slot img.cutout { width: 100%; height: 100%; object-fit: contain; object-position: bottom center; }
  /* 1st place: the photo's hard bottom crop was visible, so the last ~110px
     of the cutout fades to transparent (gradient mask) and a soft blur band
     sits over the seam to melt what's left into the background */
  #p1-media video.alpha, #p1-media img.cutout {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 110px), rgba(0,0,0,0.55) calc(100% - 55px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0%, #000 calc(100% - 110px), rgba(0,0,0,0.55) calc(100% - 55px), transparent 100%);
  }
  .portrait-card { width: 68%; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden;
    background: rgba(255,255,255,0.03); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center; }
  .portrait-card img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .portrait-card .init { font-family: var(--font-serif); color: var(--bh-sand); }
  .tile { position: relative; overflow: visible; width: 100%; height: 100%; }
  .tile .dia { position: absolute; left: 12%; right: 12%; top: 12%; bottom: 12%;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    background: rgba(125,132,136,0.32); }
  .tile img { position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
    height: 92%; max-width: 100%; object-fit: contain; object-position: bottom center; }
  .tile .init { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif); font-size: 48px; color: var(--bh-sand); }
  /* soft dark glow behind names — now feathered: the tint fades out inside the
     gradient itself, and the mask steps down through several stops so both the
     darkening and the blur dissolve gradually instead of ending in a hard oval */
  .name-glow { background: radial-gradient(60% 65% at 50% 50%,
      rgba(10,20,26,0.5) 0%, rgba(10,20,26,0.38) 30%, rgba(10,20,26,0.2) 55%,
      rgba(10,20,26,0.07) 75%, rgba(10,20,26,0) 92%); }
  /* raised ordinal suffix (1st, 2nd…) */
  .ord { font-size: 0.48em; vertical-align: baseline; line-height: 0; }
  /* stepped halo: backdrop-blur always cuts off hard at its own edge, so
     we stack seven concentric ovals with tiny blur increments — each ring
     only adds 1–3px of blur over the previous one, so no single edge is
     strong enough to see, and the overall effect reads as a smooth fade.
     Adjust: outer rings = edge softness, inner rings = peak blur,
     the inset steps = how fast it ramps toward the centre. */
  .halo { position: absolute; pointer-events: none; z-index: 4;
    opacity: 0; transition: opacity 600ms ease; }
  /* halos only fade in once the scene cross-fade has finished, so the
     stepped rings never show up as ripples mid-transition */
  .scene.settled .halo { opacity: 1; }
  .halo i { position: absolute; display: block; border-radius: 50%; }
  .halo i:nth-child(1) { inset: 0;   backdrop-filter: blur(1px);  -webkit-backdrop-filter: blur(1px); }
  .halo i:nth-child(2) { inset: 7%;  backdrop-filter: blur(2px);  -webkit-backdrop-filter: blur(2px); }
  .halo i:nth-child(3) { inset: 14%; backdrop-filter: blur(3px);  -webkit-backdrop-filter: blur(3px); }
  .halo i:nth-child(4) { inset: 21%; backdrop-filter: blur(5px);  -webkit-backdrop-filter: blur(5px); }
  .halo i:nth-child(5) { inset: 28%; backdrop-filter: blur(7px);  -webkit-backdrop-filter: blur(7px); }
  .halo i:nth-child(6) { inset: 35%; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .halo i:nth-child(7) { inset: 42%; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(30px); }
</style>
</head>

<script>
/* =====================================================================
   CONFIG
===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://xbjzvtnpbyadolkexsvq.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhianp2dG5wYnlhZG9sa2V4c3ZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5MjMyNjksImV4cCI6MjEwNDQ5OTI2OX0.ieFmzlAuRcNyJdtIo44zj1p0ksyEDMcZ5GsLJxovGJw",
  TIMEZONE_OFFSET_HOURS: 4,        // Asia/Dubai — used for month boundaries
  STORAGE_BUCKET: "media",
  BG_VIDEO_URL: null,              // optional looping hero webm
  REFRESH_MINUTES: 5,              // re-fetch board data
  CELEBRATION_POLL_SECONDS: 30,    // how often to check the approval queue
  CELEBRATION_SECONDS: 15,         // how long each celebration plays
  CELEBRATION_GAP_SECONDS: 3,      // breather between back-to-back celebrations
  CELEBRATION_PLAYS: 2,            // each celebration shows this many times in total
  CELEBRATION_REPLAY_GAP_MINUTES: 30, // wait between the showings
  SCENES: [
    // deal_type: "Sale" | "Rent" | undefined (all deals)
    { title: "Top Sales value",       metric: "rank_by_value",      date_field: "reserved", deal_type: "Sale", seconds: 45 },
    { title: "Top Leasing value",     metric: "rank_by_value",      date_field: "reserved", deal_type: "Rent", seconds: 45 },
    { title: "Top Sales volume",      metric: "rank_by_deals",      date_field: "reserved", deal_type: "Sale", seconds: 45 },
    { title: "Top Leasing volume",    metric: "rank_by_deals",      date_field: "reserved", deal_type: "Rent", seconds: 45 },
    { title: "Closed deals",          metric: "rank_by_commission", date_field: "closed",   seconds: 45 },
    // activity scenes: source = activity_leaderboard() over activity_facts (CMS activities, ingested daily by n8n)
    // activity_type: "Viewing" (counts Completed only) | "Offer" (counts all except Rejected/Cancelled)
    // lead_type: "Sale" | "Rent" | undefined (all)
    { title: "Most viewings",         metric: "rank_by_activity",   source: "activity", activity_type: "Viewing", seconds: 45 },
    { title: "Most offers",           metric: "rank_by_activity",   source: "activity", activity_type: "Offer",   seconds: 45 },
  ],
};

/* =====================================================================
   Helpers
===================================================================== */
const sbHeaders = { "apikey": CONFIG.SUPABASE_ANON_KEY, "Authorization": `Bearer ${CONFIG.SUPABASE_ANON_KEY}`, "Content-Type": "application/json" };
const rpc = async (fn, body = {}) => {
  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: "POST", headers: sbHeaders, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`${fn} ${res.status}: ${await res.text()}`);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
};

/* Month boundaries in DUBAI time, not UTC (the Aug-31 bug fix) */
function periodBounds() {
  const nowDubai = new Date(Date.now() + CONFIG.TIMEZONE_OFFSET_HOURS * 3600000);
  const y = nowDubai.getUTCFullYear(), m = nowDubai.getUTCMonth();
  const pad = (n) => String(n + 1).padStart(2, "0");
  const start = `${y}-${pad(m)}-01`;
  const end = m === 11 ? `${y + 1}-01-01` : `${y}-${pad(m + 1)}-01`;
  // shift boundaries so "month" means Dubai-midnight to Dubai-midnight
  const tz = `T00:00:00+04:00`;
  return [start + tz, end + tz, start];
}

const mediaUrl = (p) => !p ? null : (/^https?:\/\//.test(p) ? p : `${CONFIG.SUPABASE_URL}/storage/v1/object/public/${CONFIG.STORAGE_BUCKET}/${p}`);
const initials = (n) => (n || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const firstLast = (n) => { const p = (n || "").trim().split(/\s+/); return p.length <= 1 ? [n || "", ""] : [p[0], p.slice(1).join(" ")]; };

function fmtValue(v) {
  const n = Number(v) || 0;
  if (n >= 1_000_000) { const m = n / 1_000_000; return `AED ${m >= 100 ? m.toFixed(0) : m.toFixed(1).replace(/\.0$/, "")}M`; }
  if (n >= 1_000) return `AED ${Math.round(n / 1000)}K`;
  return `AED ${n.toLocaleString("en-US")}`;
}
const fmtDateShort = (iso) => !iso ? "" : new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

/* Portrait renderers:
   - transparent webm -> fills the slot, bottom-anchored (mockup behaviour)
   - photo -> designed portrait card
   - nothing -> portrait card with initials */
function renderPortrait(slot, entry, initialsPx) {
  slot.innerHTML = "";
  const url = mediaUrl(entry?.media_url);
  if (url && entry.media_type === "webm") {
    const v = document.createElement("video");
    v.className = "alpha"; v.src = url; v.autoplay = true; v.muted = true; v.playsInline = true; v.loop = true;
    v.onerror = () => renderPortrait(slot, { ...entry, media_type: "photo", media_url: entry.photo_url || null }, initialsPx);
    slot.appendChild(v); v.play().catch(() => {});
    return;
  }
  if (url && entry.media_type === "photo") {
    // cutout portrait fills the slot exactly like the mockup webms
    const img = document.createElement("img");
    img.className = "cutout"; img.src = url; img.alt = entry?.name || "";
    img.onerror = () => {
      slot.innerHTML = `<div class="portrait-card"><span class="init" style="font-size:${initialsPx}px;">${initials(entry?.name)}</span></div>`;
    };
    slot.appendChild(img);
    return;
  }
  slot.innerHTML = `<div class="portrait-card"><span class="init" style="font-size:${initialsPx}px;">${initials(entry?.name)}</span></div>`;
}

function renderTile(slot, entry) {
  slot.innerHTML = "";
  const t = document.createElement("div");
  t.className = "tile";
  const dia = document.createElement("div");
  dia.className = "dia";
  t.appendChild(dia);
  const url = mediaUrl(entry?.row_photo_url);
  if (url) {
    const img = document.createElement("img");
    img.src = url;
    img.onerror = () => { img.remove(); const s = document.createElement("span"); s.className = "init"; s.textContent = initials(entry?.name); t.appendChild(s); };
    t.appendChild(img);
  } else {
    const s = document.createElement("span");
    s.className = "init"; s.textContent = initials(entry?.name);
    t.appendChild(s);
  }
  slot.appendChild(t);
}

/* =====================================================================
   Board rows 4th–8th
===================================================================== */
const ROW_TOPS = [166, 344, 522, 700, 877], PHOTO_TOPS = [119, 296, 474, 653, 831];
document.getElementById("rows").innerHTML = ROW_TOPS.map((top, i) => {
  const rank = i + 4, pTop = PHOTO_TOPS[i];
  return `
  <div class="media-slot" id="r${rank}-media" style="left:1342px; top:${pTop}px; width:196px; height:197px; z-index:2;"></div>
  <div class="row-panel" style="top:${top}px;">
    <span id="r${rank}-name" style="position:absolute; top:32px; right:36px; max-width:210px; font-family:var(--font-serif); font-size:22px; text-align:right; line-height:1.15; color:var(--bh-white);"></span>
    <span id="r${rank}-division" style="position:absolute; top:98px; right:36px; font-family:var(--font-epic); font-size:10px; text-align:right; color:rgba(255,255,255,0.8);"></span>
  </div>
  <span style="position:absolute; left:1248px; top:${top + 66}px; transform:translateY(-50%); font-family:var(--font-serif); font-size:84px; line-height:1.1; color:var(--bh-sand); z-index:3;">${rank}<span class="ord">th</span></span>
  <span id="r${rank}-value" style="position:absolute; left:1536px; top:${top + 66}px; transform:translateY(-50%); width:152px; font-family:var(--font-serif); font-weight:600; font-size:36px; text-align:center; white-space:nowrap; color:var(--bh-white); z-index:3;"></span>`;
}).join("");

/* =====================================================================
   Data
===================================================================== */
const boardCache = {}; // one entry per scene (date_field + metric + deal_type)
const sceneKey = (s) => s.source === "activity"
  ? `activity|${s.activity_type}|${s.metric}|${s.lead_type || "all"}`
  : `${s.date_field}|${s.metric}|${s.deal_type || "all"}`;

async function fetchBoard(scene) {
  const [start, end] = periodBounds();
  const rows = scene.source === "activity"
    ? await rpc("activity_leaderboard", { p_start: start, p_end: end, p_type: scene.activity_type, p_lead_type: scene.lead_type || null })
    : await rpc("leaderboard",          { p_start: start, p_end: end, p_date_field: scene.date_field, p_deal_type: scene.deal_type || null });
  rows.sort((a, b) => a[scene.metric] - b[scene.metric]);
  boardCache[sceneKey(scene)] = rows.slice(0, 8);
}

function valueFor(entry, metric, scene) {
  if (metric === "rank_by_activity") {
    const n = Number(entry.activity_count);
    const noun = scene && scene.activity_type === "Offer" ? "offer" : "viewing";
    return `${n} ${noun}${n === 1 ? "" : "s"}`;
  }
  if (metric === "rank_by_commission") return fmtValue(entry.total_gross_commission);
  if (metric === "rank_by_deals") return `${entry.deals} ${Number(entry.deals) === 1 ? "deal" : "deals"}`;
  return fmtValue(entry.total_value);
}

function renderBoard(scene) {
  const rows = boardCache[sceneKey(scene)] || [];
  document.getElementById("board-title").textContent = scene.title;
  [1, 2, 3].forEach((rank, idx) => {
    const e = rows[idx];
    document.getElementById(`p${rank}-name`).textContent = e ? e.name : "—";
    document.getElementById(`p${rank}-title`).textContent = e ? (e.designation || e.branch_name || "") : "";
    document.getElementById(`p${rank}-value`).textContent = e ? valueFor(e, scene.metric, scene) : "";
    renderPortrait(document.getElementById(`p${rank}-media`), e, rank === 1 ? 150 : 100);
  });
  for (let i = 0; i < 5; i++) {
    const rank = i + 4, e = rows[3 + i];
    const nameEl = document.getElementById(`r${rank}-name`);
    if (!e) { nameEl.textContent = ""; ["value", "division"].forEach(k => document.getElementById(`r${rank}-${k}`).textContent = ""); document.getElementById(`r${rank}-media`).innerHTML = ""; continue; }
    const [f, l] = firstLast(e.name);
    nameEl.innerHTML = l ? `${f}<br>${l}` : f;
    document.getElementById(`r${rank}-value`).textContent = valueFor(e, scene.metric, scene).replace(/^AED\s*/, "");
    document.getElementById(`r${rank}-division`).textContent = e.branch_name || "";
    renderTile(document.getElementById(`r${rank}-media`), e);
  }
}

/* =====================================================================
   Celebrations (take-over)
   Each celebration shows CELEBRATION_PLAYS times in total: the first
   showing happens as soon as it's approved, and each repeat is scheduled
   CELEBRATION_REPLAY_GAP_MINUTES later on this screen. The event is marked
   `played` in the DB after the FIRST showing (so the admin queue behaves
   exactly as before); the repeats live in this screen's memory.
===================================================================== */
let celebrationQueue = [], scheduledReplays = [], celebrating = false;

function promoteDueReplays() {
  const now = Date.now();
  for (let i = scheduledReplays.length - 1; i >= 0; i--) {
    if (scheduledReplays[i]._dueAt <= now) celebrationQueue.push(scheduledReplays.splice(i, 1)[0]);
  }
}

async function pollCelebrations() {
  try {
    const pending = await rpc("pending_celebrations") || [];
    const known = new Set([...celebrationQueue, ...scheduledReplays].map(c => c.id));
    pending.forEach(c => { if (!known.has(c.id)) celebrationQueue.push(c); });
  } catch (e) { /* silent; board keeps playing */ }
}

async function playCelebration(c) {
  celebrating = true;
  document.getElementById("c-headline").textContent = c.headline || "";
  document.getElementById("c-value").textContent = fmtValue(c.sale_value);
  document.getElementById("c-commission").textContent = fmtValue(c.commission_value);
  document.getElementById("c-name").textContent = c.name || "";
  document.getElementById("c-title").textContent = c.designation || "";
  renderPortrait(document.getElementById("c-media"), c, 170);
  showScene("scene-congrats");
  await new Promise(r => setTimeout(r, CONFIG.CELEBRATION_SECONDS * 1000));
  const playsDone = (c._plays || 0) + 1;
  if (playsDone === 1) {
    try { await rpc("mark_celebration_played", { p_id: c.id }); } catch (e) {}
  }
  if (playsDone < (CONFIG.CELEBRATION_PLAYS || 1)) {
    scheduledReplays.push({ ...c, _plays: playsDone, _dueAt: Date.now() + CONFIG.CELEBRATION_REPLAY_GAP_MINUTES * 60000 });
  }
  celebrating = false;
}

/* =====================================================================
   Scene loop
===================================================================== */
function showScene(id) {
  document.querySelectorAll(".scene").forEach(s => {
    s.classList.toggle("active", s.id === id);
    s.classList.remove("settled");
  });
  clearTimeout(showScene._t);
  if (id) showScene._t = setTimeout(() => {
    const s = document.getElementById(id);
    if (s && s.classList.contains("active")) s.classList.add("settled");
  }, 950); // just past the 900ms scene fade
}

async function loop() {
  let i = 0;
  for (;;) {
    promoteDueReplays();
    // Celebrations take priority over the rotation
    if (celebrationQueue.length) {
      await playCelebration(celebrationQueue.shift());
      if (celebrationQueue.length) {
        // more queued: fade to the background for a beat so each one lands as its own moment
        showScene("");
        await new Promise(r => setTimeout(r, CONFIG.CELEBRATION_GAP_SECONDS * 1000));
      }
      continue;
    }
    const scene = CONFIG.SCENES[i % CONFIG.SCENES.length]; i++;
    try { await fetchBoard(scene); renderBoard(scene); setStatus(scene); } catch (e) { setStatus(scene, e); }
    showScene("scene-board");
    // wait scene.seconds, but wake early if a celebration arrives or a replay comes due
    const until = Date.now() + scene.seconds * 1000;
    while (Date.now() < until && !celebrationQueue.length) {
      promoteDueReplays();
      await new Promise(r => setTimeout(r, 1000));
    }
  }
}

function setStatus(scene, err) {
  const [, , label] = periodBounds();
  document.getElementById("status").textContent = err
    ? `Refresh failed — showing last known board · ${err.message}`
    : `${scene.title} · period from ${label} · updated ${new Date().toLocaleTimeString("en-GB")}`;
}

/* =====================================================================
   Clock, scale, boot
===================================================================== */
function tickClock() {
  const now = new Date();
  document.getElementById("live-date").textContent = now.toLocaleDateString("en-US", { day: "numeric", month: "long", year: "numeric" });
  let h = now.getHours(); const ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
  document.getElementById("live-time").textContent = `${h} : ${String(now.getMinutes()).padStart(2, "0")} : ${String(now.getSeconds()).padStart(2, "0")} ${ampm}`;
}
function fitStage() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById("stage").style.transform = `scale(${s > 0 ? s : 1})`;
}

/* =====================================================================
   Realtime + housekeeping
   - Supabase Realtime pushes celebration changes instantly; the 30s poll
     below stays on as a safety net, so a CDN or websocket failure can
     never take the player down. Loaded dynamically for the same reason.
   - Requires celebration_events in the `supabase_realtime` publication
     and a SELECT policy for the anon role (see supabase-realtime-setup.sql).
   - A screen left on for weeks accumulates cruft, so we hard-reload the
     page once a day at 04:10 local time.
===================================================================== */
async function startRealtime() {
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    sb.channel("player-celebrations")
      .on("postgres_changes", { event: "*", schema: "public", table: "celebration_events" }, () => pollCelebrations())
      .subscribe();
  } catch (e) { /* realtime unavailable — polling covers us */ }
}

function scheduleDailyReload() {
  const now = new Date(), next = new Date(now);
  next.setHours(4, 10, 0, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  setTimeout(() => location.reload(), next - now);
}

(function boot() {
  if (CONFIG.BG_VIDEO_URL) { const bg = document.getElementById("bg-video"); bg.src = CONFIG.BG_VIDEO_URL; bg.style.display = "block"; bg.play().catch(() => {}); }
  fitStage(); window.addEventListener("resize", fitStage);
  tickClock(); setInterval(tickClock, 1000);
  pollCelebrations(); setInterval(pollCelebrations, CONFIG.CELEBRATION_POLL_SECONDS * 1000);
  startRealtime();
  scheduleDailyReload();
  loop();
})();
</script>
</body>
</html>
